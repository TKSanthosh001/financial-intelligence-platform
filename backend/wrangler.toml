name = "financial-intelligence-backend"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
# NVIDIA NIM API key will be bound here or pulled from secrets
# NVIDIA_NIM_API_KEY = "..."

[[d1_databases]]
binding = "DB"
database_name = "financial-platform-db"
database_id = "05be4ff7-8c36-425b-9ffa-891e95ff8e74"

# Cron trigger for running the AI morning report every day at 6:00 AM
[triggers]
crons = ["0 6 * * *"]
